services:
  postgres:
    image: postgres:16
    container_name: pg_hookrelay
    ports:
      - "5432:5432"
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hookrelay
    volumes:
      - pg_data:/var/lib/postgresql/data
  redis:
    image: redis:7.4-alpine
    container_name: redis_hookrelay
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  pg_data:
  redis_data:
    driver: local
